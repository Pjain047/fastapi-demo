grafana:
  enabled: true

  service:
    type: ClusterIP

prometheus:
  enabled: true

  service:
    type: ClusterIP

  prometheusSpec:
    retention: 2d
    # Discover ServiceMonitors from ALL namespaces (not just "monitoring")
    serviceMonitorNamespaceSelector: {}
    # Do NOT restrict to ServiceMonitors with the Helm release label
    serviceMonitorSelectorNilUsesHelmValues: false

alertmanager:
  enabled: true

prometheus-node-exporter:
  enabled: true

kube-state-metrics:
  enabled: true
