name: CI

on:
  push:
    branches:
      - main
      - "bugfix/**"
      - "feature/**"
  pull_request:
    branches:
      - main
      - "bugfix/**"
      - "feature/**"
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  REGISTRY: docker.io

jobs:
  test:
    name: Test and coverage
    runs-on: ubuntu-latest
    outputs:
      sonar_result: ${{ steps.sonar.outcome }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Run tests with coverage
        run: pytest --cov=app --cov-report=term-missing --cov-report=xml:coverage.xml --junitxml=junit.xml

      - name: SonarQube analysis
        id: sonar
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io

      - name: Upload test and coverage reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            coverage.xml
            junit.xml
          if-no-files-found: warn

  docker:
    name: Build and publish Docker image
    needs: test
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/bugfix/'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ secrets.DOCKER_USERNAME }}/fastapi-demo
          tags: |
            type=ref,event=branch
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  report:
    name: Publish CI report
    needs: [test, docker]
    if: ${{ always() && needs.test.result != 'cancelled' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Download test reports
        uses: actions/download-artifact@v4
        with:
          name: test-reports
          path: reports
          if-no-artifact-found: warn

      - name: Generate HTML and Markdown report
        env:
          TEST_RESULT: ${{ needs.test.result }}
          SONAR_RESULT: ${{ needs.test.outputs.sonar_result }}
          DOCKER_RESULT: ${{ needs.docker.result }}
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
        run: python scripts/generate_ci_report.py

      - name: Add report to workflow summary
        run: cat report/summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload downloadable HTML report
        uses: actions/upload-artifact@v4
        with:
          name: ci-report
          path: report/