name: CI

on:
  push:
    branches:
      - main
      - "bugfix/**"
      - "feature/**"
  pull_request:
    branches:
      - main
      - "bugfix/**"
      - "feature/**"
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  REGISTRY: docker.io

jobs:
  test:
    name: Test and coverage
    runs-on: ubuntu-latest
    outputs:
      sonar_result: ${{ steps.sonar.outcome }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Run tests with coverage
        run: pytest --cov=app --cov-report=term-missing --cov-report=xml:coverage.xml --junitxml=junit.xml

      - name: SonarQube analysis
        id: sonar
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io

      - name: Upload test and coverage reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            coverage.xml
            junit.xml
          if-no-files-found: warn

  docker:
    name: Build and publish Docker image
    needs: test
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/bugfix/'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ secrets.DOCKER_USERNAME }}/fastapi-demo
          tags: |
            type=ref,event=branch
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  helm:
    name: Validate Helm chart
    runs-on: ubuntu-latest
    outputs:
      helm_result: ${{ steps.validation.outcome }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.17.0

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: v1.31.0

      - name: Verify Kubernetes tooling
        run: |
          helm version --short
          kubectl version --client
          docker version --format '{{.Server.Version}}'

      - name: Lint chart
        id: lint
        continue-on-error: true
        working-directory: helm_infra/fastapi-demo
        run: |
          set -o pipefail
          helm lint . 2>&1 | tee ../../helm-lint.txt

      - name: Render chart
        id: render
        continue-on-error: true
        working-directory: helm_infra/fastapi-demo
        run: helm template fastapi-demo . --namespace fastapi-demo > ../../helm-rendered.yaml

      - name: Validate rendered Kubernetes resources
        id: kubectl
        continue-on-error: true
        run: |
          set -o pipefail
          kubectl apply --dry-run=client --validate=false -f helm-rendered.yaml 2>&1 | tee helm-kubectl-validation.txt

      - name: Validate Kubernetes schemas with kubeconform
        id: kubeconform
        continue-on-error: true
        run: |
          set -o pipefail
          docker run --rm -i ghcr.io/yannh/kubeconform:latest \
            -strict -summary -output text < helm-rendered.yaml 2>&1 | tee helm-kubeconform-validation.txt

      - name: Validate Helm result
        id: validation
        if: ${{ always() }}
        run: |
          if [ "${{ steps.lint.outcome }}" != "success" ] || \
             [ "${{ steps.render.outcome }}" != "success" ] || \
             [ "${{ steps.kubectl.outcome }}" != "success" ] || \
             [ "${{ steps.kubeconform.outcome }}" != "success" ]; then
            echo "Helm validation failed"
            exit 1
          fi

      - name: Upload Helm validation artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: helm-validation
          path: |
            helm-lint.txt
            helm-rendered.yaml
            helm-kubectl-validation.txt
            helm-kubeconform-validation.txt
          if-no-files-found: warn

  report:
    name: Publish CI report
    needs: [test, docker, helm]
    if: ${{ always() && needs.test.result != 'cancelled' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Download test reports
        uses: actions/download-artifact@v4
        with:
          name: test-reports
          path: reports
          if-no-artifact-found: warn

      - name: Generate HTML and Markdown report
        env:
          TEST_RESULT: ${{ needs.test.result }}
          SONAR_RESULT: ${{ needs.test.outputs.sonar_result }}
          DOCKER_RESULT: ${{ needs.docker.result }}
          HELM_RESULT: ${{ needs.helm.result }}
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
        run: python scripts/generate_ci_report.py

      - name: Add report to workflow summary
        run: cat report/summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload downloadable HTML report
        uses: actions/upload-artifact@v4
        with:
          name: ci-report
          path: report/